name: Build CEBİ APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'yi indir
        uses: actions/checkout@v4

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bağımlılıkları kur
        run: npm install

      - name: Web uygulamasını oluştur
        run: npx vite build

      - name: Capacitor Android projesini oluştur
        run: npx cap add android

      - name: Web dosyalarını Android'e aktar
        run: npx cap sync android

      - name: Java kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK kurulumu
        uses: android-actions/setup-android@v3

      - name: Gradle ile APK oluştur
        working-directory: android
        run: ./gradlew assembleDebug

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: cebi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
