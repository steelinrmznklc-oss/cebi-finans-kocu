name: Build CEBİ APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Android APK branch'ini indir
        uses: actions/checkout@v4
        with:
          ref: android-apk

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları Yükle
        run: npm install --include=optional

      - name: Tailwind Linux native modülünü garanti et
        run: npm install @tailwindcss/oxide-linux-x64-gnu --save-dev

      - name: Web uygulamasını oluştur
        run: npx vite build --base=./

      - name: Capacitor Android projesini oluştur
        run: npx cap add android

      - name: Web dosyalarını Android'e aktar
        run: npx cap sync android

      - name: Java JDK Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK Kurulumu
        uses: android-actions/setup-android@v3

      - name: Android APK Derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: cebi-release-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
