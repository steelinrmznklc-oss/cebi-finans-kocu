name: Build CEBİ APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Android APK branch'ini indir
        uses: actions/checkout@v4
        with:
          ref: android-apk

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları Yükle
        run: npm install

      - name: Tailwind Linux native paketini yükle
        run: npm install @tailwindcss/oxide-linux-x64-gnu --save-dev

      - name: TypeScript kontrolü
        run: npx tsc --noEmit

      - name: Capacitor / Web Build Al
        run: npm run build

      - name: Android projesini oluştur
        run: npx cap add android

      - name: Capacitor sync
        run: npx cap sync android

      - name: Java JDK Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Android APK Derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: cebi-release-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
